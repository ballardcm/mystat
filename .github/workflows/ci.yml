name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and package
        run: ./scripts/release.sh
      - name: Exercise signed update failures and install/relaunch
        run: ./scripts/test-updates-integration.sh
      - name: Verify artifact checksum
        run: cd dist && shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyStat-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
